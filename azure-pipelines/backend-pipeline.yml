trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: notes-backend
  acrName: notesapp.azurecr.io
  dockerRegistryServiceConnection: acr-service-connection
  azureSubscription: azure-service-connection
  webAppName: notes-backend-app

stages:
- stage: BuildAndPush
  jobs:
  - job: DockerBuild
    steps:

    - task: Docker@2
      displayName: Build and Push Backend Image
      inputs:
        command: buildAndPush
        repository: $(imageName)
        dockerfile: backend/Dockerfile
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          latest

- stage: Deploy
  dependsOn: BuildAndPush
  jobs:
  - job: DeployBackend
    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Backend Container
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(webAppName)
        containers: $(acrName)/$(imageName):latest